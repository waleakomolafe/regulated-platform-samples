# Regulated deploy — a reusable workflow template
#
# What this demonstrates (the controls a regulated change process needs,
# carried by the pipeline instead of by a document):
#
#   1. APPROVAL IS THE ENVIRONMENT. The deploy job runs in a GitHub
#      environment whose protection rules (required reviewers) are
#      configured on the environment, not in code a PR can weaken. The
#      template cannot bypass its own gate, because the gate is not in
#      the template.
#   2. NO STORED CLOUD SECRETS. Azure access is OIDC federation:
#      permissions: id-token: write plus azure/login with client-id /
#      tenant-id / subscription-id from ENVIRONMENT VARIABLES — public,
#      non-secret configuration. There is no AZURE_CLIENT_SECRET, no
#      stored credential, nothing to rotate or leak. See
#      docs/decisions/0003.
#   3. EVIDENCE IS PRODUCED, NOT PROMISED. The terraform plan, the apply
#      log, and the post-apply state hash are uploaded as artifacts —
#      the change record an auditor asks for, generated by the change.
#   4. THIRD-PARTY ACTIONS ARE SHA-PINNED. Upstream cannot change what
#      this pipeline runs. tools/check_pipeline_template.py fails the
#      build if any of the above regress.
#
# Use it from a caller workflow:
#
#   jobs:
#     deploy:
#       uses: waleakomolafe/regulated-platform-samples/.github/... 
#       with:
#         environment: production
#
# (Ship it as .github/workflows/ in your repo, or call the copy here
# after moving it into .github/workflows — GitHub only executes
# workflow_call files from that directory.)

name: Regulated deploy (template)

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment to deploy through. Its protection rules are the approval gate."
        required: true
        type: string
      module_dir:
        description: "Terraform module directory to plan and apply."
        required: false
        type: string
        default: terraform/modules/secure-storage
      run_tests:
        description: "Run the module test step before planning."
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  # OIDC federation to Azure. This is the only elevated grant, it is
  # scoped to minting a short-lived token, and it replaces every stored
  # cloud secret this pipeline would otherwise carry.
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: Format and validate the module
        run: |
          terraform -chdir="${{ inputs.module_dir }}" fmt -check -recursive
          terraform -chdir="${{ inputs.module_dir }}" init -backend=false -input=false
          terraform -chdir="${{ inputs.module_dir }}" validate

  test:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Structural gate on this repository's own samples
        run: python tools/check_pipeline_template.py pipeline/templates/regulated-deploy.yml

  deploy:
    needs: [validate, test]
    # THE GATE. The environment's protection rules (required reviewers,
    # branch restrictions) decide whether this job starts at all. The
    # reviewer approval IS the change record's sign-off line.
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      # Non-secret, environment-scoped configuration for OIDC. The
      # federated credential on the Azure side trusts this workflow;
      # none of these values grant anything on their own.
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Plan (the evidence BEFORE)
        run: |
          terraform -chdir="${{ inputs.module_dir }}" init -input=false
          terraform -chdir="${{ inputs.module_dir }}" plan -out=tfplan -detailed-exitcode || echo "plan_exit=$?" >> "$GITHUB_ENV"
      - name: Upload the plan as evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: change-evidence-plan
          path: ${{ inputs.module_dir }}/tfplan
      - name: Apply (only after the environment approved this job)
        run: terraform -chdir="${{ inputs.module_dir }}" apply -auto-approve tfplan | tee apply.log
      - name: Upload the apply log as evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: change-evidence-apply
          path: apply.log
